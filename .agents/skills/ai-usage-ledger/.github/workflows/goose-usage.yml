name: Goose usage integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows scoped-report timezone data
        if: runner.os == 'Windows'
        run: python -m pip install tzdata
      - name: Native collector and end-to-end contracts
        run: python -m unittest discover -s tests -p 'test_goose*.py' -v
      - name: Package layout and entrypoint contracts
        run: python scripts/validate_package.py
