name: Research finding
description: Capture evidence for an AI Builder component or compatibility rule (link the related T0–T6 component issue)
title: "Research: "
labels: ["type: research"]
body:
  - type: textarea
    id: contract
    attributes:
      label: Related issue and canonical component kinds
      description: Link the component issue and use docs/CONTRACT_MAPPING.md. Follow docs/RESEARCH_WORKFLOW.md for notes and structured submissions; unknown required facts may remain in a draft note.
  - type: textarea
    id: decision
    attributes:
      label: User decision or compatibility rule
      description: What builder choice will this evidence support?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Primary evidence
      description: Include publisher, URL, access date, version, and price region/currency if applicable.
    validations:
      required: true
  - type: textarea
    id: findings
    attributes:
      label: Findings and conditions
      description: Identify hard constraints, warnings, unknowns, assumptions, and tradeoffs.
    validations:
      required: true
  - type: textarea
    id: followup
    attributes:
      label: Open questions
