name: Market research deliverable
description: Propose one independently reviewable market research outcome.
title: "MR-XX: "
labels: ["type: research"]
body:
  - type: markdown
    attributes:
      value: "Use Project #2 for market research. Search existing issues, Project #1, PRs and notes first. Assignees are authoritative; do not create an issue for every competitor."
  - type: input
    id: decision
    attributes:
      label: User decision and research question
      description: What decision changes when this is answered? What would falsify the hypothesis?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and deduplication
      description: State in/out boundaries, canonical related issues, overlap resolution and the native parent to attach after creation.
    validations:
      required: true
  - type: input
    id: deliverable
    attributes:
      label: Deliverable
      description: Exact existing or proposed research/market path and independently reviewable outcome.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Comparison fields and evidence
      description: Starting URLs, publisher, access dates, version/region, evidence grade, confidence, rights and unknowns. Never invent required fields.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and relationships
      description: Separate actual blockers, information inputs, related work, validation dependencies and technical handoffs. Name the consuming issue and requested review.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable completion criteria, validation commands and required owner review. A draft is not Done.
    validations:
      required: true
  - type: textarea
    id: triage
    attributes:
      label: Ownership, priority and readiness proposal
      description: Proposed assignee, MR-01–12, six rubric inputs or unknown, priority rationale/override, readiness, status and next action. Triage must verify these in Project fields before Ready.
    validations:
      required: true
  - type: textarea
    id: open_questions
    attributes:
      label: Open questions and phase limit
      description: Missing input or owner decision, scope limit and stopping/expansion condition.
    validations:
      required: true
